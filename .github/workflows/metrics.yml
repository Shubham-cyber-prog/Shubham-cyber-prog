
name: GitHub metrics

on:
  schedule:
    - cron: "21 6,18 * * *"
  workflow_dispatch:

jobs:
  github-metrics-personal:
    runs-on: ubuntu-latest

    steps:
      - name: Personal metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Shubham-cyber-prog

          base: "header, activity, repositories"
          config_display: large
          config_timezone: Asia/Kolkata

          plugin_introduction: yes
          plugin_introduction_title: yes

          plugin_lines: yes
          plugin_lines_sections: history,repositories

          plugin_music: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_topics: yes
          plugin_topics_sort: random

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_stars: yes
          plugin_stars_limit: 4
          plugin_stargazers: yes

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14

          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 100
          plugin_people_size: 28

          repositories_forks: yes

          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_days: 14
          plugin_reactions_details: percentage

          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 8
          plugin_achievements_display: compact

          plugin_notable: yes
          plugin_fortune: yes

  github-metrics-detailed-personal:
    runs-on: ubuntu-latest

    steps:
      - name: Personal metrics (detailed)
        uses: JayantGoel001/metrics@master
        with:
          filename: metrics.detailed.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Shubham-cyber-prog

          base: "metadata"
          config_display: large
          config_timezone: Asia/Kolkata

          plugin_gists: yes

          plugin_pagespeed: yes
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
          plugin_pagespeed_screenshot: yes
          plugin_pagespeed_pwa: yes
          plugin_pagespeed_url: https://your-portfolio-url.com

          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_followup_indepth: yes

          plugin_languages: yes
          plugin_languages_colors: "rainbow"
          plugin_languages_details: bytes-size, percentage

          plugin_posts: yes
          plugin_posts_source: dev.to
          plugin_posts_limit: 2
          plugin_posts_descriptions: yes
          plugin_posts_covers: yes
          plugin_posts_user: shubham_nayak_

          plugin_leetcode: yes
          plugin_leetcode_user: SubhamN2006
          plugin_leetcode_sections: solved, skills, recent
