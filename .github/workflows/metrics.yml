   name: 📊 GitHub Metrics Pro
on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours (rate limit friendly)
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force complete refresh'
        required: false
        default: 'false'

# Cache settings for faster runs
env:
  CACHE_KEY: metrics-${{ github.sha }}

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Cache
        uses: actions/cache@v3
        with:
          path: ~/.metrics
          key: ${{ env.CACHE_KEY }}
          
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@v3.22
        with:
          # 🔐 TOKEN CONFIGURATION (FIXED)
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          
          # 📍 USER & TEMPLATE
          user: Shubham-cyber-prog
          template: classic
          
          # 🎯 BASIC CONFIG
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          config_display: large
          config_order: activity, repositories, community, metadata
          config_animate: yes
          
          # 🏆 ACHIEVEMENTS
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 6
          
          # 🌐 LANGUAGES
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_colors: github
          
          # 🔥 STREAKS
          plugin_streak: yes
          plugin_streak_days: 365
          
          # 📅 ACTIVITY
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 14
          
          # 🏅 TROPHIES
          plugin_trophy: yes
          plugin_trophy_rank: SS
          
          # 📊 REPOSITORIES
          plugin_repositories: yes
          plugin_repositories_limit: 6
          plugin_repositories_sort: stars
          
          # 🧠 LEETCODE
          plugin_leetcode: yes
          plugin_leetcode_user: SubhamN2006
          plugin_leetcode_sections: solved, recent
          
          # ⭐ STARS & FOLLOWERS
          plugin_stars: yes
          plugin_followup: yes
          
          # 📈 TRAFFIC (Optional - requires repo admin)
          plugin_traffic: ${{ github.event_name == 'workflow_dispatch' }}
          
          # 🕒 WAKATIME (Conditional)
          plugin_wakatime: ${{ github.event.inputs.force_refresh == 'true' && secrets.WAKATIME_API_KEY != '' }}
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 7
          
          # 📌 PINS
          plugin_pin: yes
          plugin_pin_limit: 4
          
          # 🏢 ORGANIZATIONS
          plugin_organizations: yes
          
          # 🎨 STYLING
          config_title: "🚀 Shubham's GitHub Stats"
          config_twemoji: yes
          config_background_color: "0D1117"
          config_border_radius: 15
          
      # ✅ REMOVED Image Optimization Step (Not needed)
      # It was causing error and only works on PRs
      
      - name: Verify Output
        run: |
          echo "✅ Metrics generated successfully!"
          echo "Generated at: $(date)"
          echo "Workflow: ${{ github.event_name }}"
          
      # 📤 Auto-commit changes (Optional)
      - name: Commit Metrics
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Updated GitHub metrics [skip ci]"
            git push
          fi
          
      # 🚨 Failure Notification
      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            console.log('Workflow failed - check Actions tab');
