
name: 📊 GitHub Metrics Ultra

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Run all plugins including heavy ones'
        required: false
        default: 'false'

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write  # 🔥 REQUIRED FOR FAILURE ALERT
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Cache metrics data
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/metrics
            ~/.npm
          key: ${{ runner.os }}-metrics-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-metrics-
            
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # 🔐 AUTHENTICATION
          token: ${{ secrets.GITHUB_TOKEN || secrets.GH_METRICS_KEY }}
          
          # 👤 USER PROFILE
          user: Shubham-cyber-prog
          template: classic
          
          # 🎨 VISUAL SETTINGS
          base: header, activity, community, repositories, metadata, coding
          config_timezone: Asia/Kolkata
          config_display: large
          config_title: |
            🚀 <span style="color:#58a6ff">Shubham Singh</span> | Full-Stack Developer
          config_description: |
            AI/ML Enthusiast • Open Source Contributor • Problem Solver
          config_order: activity, repositories, coding, community, metadata
          config_padding: 20, 30
          config_twemoji: yes
          config_background: gradient
          config_background_color: "0D1117,161B22"  # ✅ QUOTE FIXED
          config_border: yes
          config_border_radius: 20
          config_shadow: yes
          config_animate: yes
          
          # ... (Rest of your plugins remain the same)
          
      - name: Auto-commit Metrics
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "📈 Update GitHub metrics [skip ci]"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          
      # ✅ यह अब work करेगा क्योंकि issues: write permission है
      - name: Failure Alert
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ GitHub Metrics Update Failed',
              body: 'The metrics workflow failed. Please check the Actions tab.',
              labels: ['metrics', 'ci-fail']
            });
