name: GitHub metrics

on:
  schedule:
    - cron: "21 6,18 * * *"
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  github-metrics-core:
    runs-on: ubuntu-latest
    steps:
      - name: Core metrics
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Shubham-cyber-prog
          base: "header, activity, community, repositories"
          config_timezone: Asia/Kolkata

          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_lines: yes
          plugin_stars: yes
          plugin_stars_limit: 3
          plugin_stargazers: yes
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          repositories_forks: yes
          plugin_achievements: no

  github-metrics-social:
    needs: github-metrics-core
    runs-on: ubuntu-latest
    steps:
      - name: Social metrics
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.social.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Shubham-cyber-prog
          base: ""
          config_timezone: Asia/Kolkata

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes

  github-metrics-community:
    needs: github-metrics-social
    runs-on: ubuntu-latest
    steps:
      - name: Community metrics
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.community.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Shubham-cyber-prog
          base: ""
          config_timezone: Asia/Kolkata

          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 100
          plugin_people_size: 28
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_days: 14
          plugin_notable: yes
          plugin_notable_types: commit

  github-metrics-detailed:
    needs: github-metrics-community
    runs-on: ubuntu-latest
    steps:
      - name: Detailed metrics
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.detailed.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Shubham-cyber-prog
          base: "header, metadata"
          config_timezone: Asia/Kolkata

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_posts: yes
          plugin_posts_source: dev.to
          plugin_posts_limit: 3
          plugin_posts_descriptions: yes
          plugin_posts_covers: yes
          plugin_posts_user: shubham_nayak_
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_leetcode: yes
          plugin_leetcode_user: SubhamN2006
          plugin_leetcode_sections: solved, skills, recent
          plugin_calendar: yes
          plugin_calendar_limit: 1
