
name: 📊 GitHub Metrics Pro

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force refresh WakaTime/LeetCode'
        required: false
        default: 'false'

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Shubham-cyber-prog
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: large
          config_title: "🚀 Shubham's GitHub Metrics"
          config_order: activity, community, repositories, metadata
          config_padding: 20, 30
          config_twemoji: yes
          config_background_color: "0D1117"
          config_border_radius: 15

          # -------------------------
          # 🏆 Achievements & Gamification
          # -------------------------
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 10
          plugin_streak: yes
          plugin_streak_days: 365
          plugin_trophy: yes
          plugin_trophy_rank: SS
          plugin_trophy_progress: yes

          # -------------------------
          # 🌐 Languages & Coding Habits
          # -------------------------
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_colors: github
          plugin_languages_details: percentage, bytes-size
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14

          # -------------------------
          # 🏢 Repos, Pinned, Orgs, Stars
          # -------------------------
          plugin_repositories: yes
          plugin_repositories_limit: 6
          plugin_repositories_sort: stars
          plugin_pin: yes
          plugin_pin_limit: 6
          plugin_organizations: yes
          plugin_organizations_limit: 12
          plugin_stars: yes
          plugin_followup: yes

          # -------------------------
          # 📊 Activity & Contribution
          # -------------------------
          plugin_activity: yes
          plugin_activity_limit: 10
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_visibility: public
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # -------------------------
          # 🕒 WakaTime (Conditional)
          # -------------------------
          plugin_wakatime: ${{ github.event.inputs.force_refresh == 'true' && secrets.WAKATIME_API_KEY != '' }}
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 7
          plugin_wakatime_limit: 5
          plugin_wakatime_sections: time, projects, languages, editors, os

          # -------------------------
          # 🧠 LeetCode Stats (Conditional)
          # -------------------------
          plugin_leetcode: ${{ github.event.inputs.force_refresh == 'true' }}
          plugin_leetcode_user: SubhamN2006
          plugin_leetcode_sections: solved, skills, contests, recent
          plugin_leetcode_limit_recent: 8
          plugin_leetcode_limit_skills: 10

          # -------------------------
          # ⚙️ Pages & Icons
          # -------------------------
          plugin_pages: yes
          plugin_icons: yes
          plugin_icons_per_row: 8
          plugin_icons_size: 32

      # -------------------------
      # ✅ Commit changes if any
      # -------------------------
      - name: Commit Metrics
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Metrics Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Updated GitHub metrics [skip ci]"
            git push
          fi

      # -------------------------
      # 🚨 Failure Notification
      # -------------------------
      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            console.log('GitHub Metrics workflow failed! Check Actions tab.')
