name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "31 7 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v2

      - uses: yoshi389111/github-profile-3d-contrib@0.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}  # ✅ Use your custom PAT
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: 250

      - name: Commit & Push
        run: |
          git config --global user.name "${{ github.repository_owner }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A .
          git commit -m "🎯 Updated GitHub 3D Profile"
          git push https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
